<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>DBR 实验性游戏技术项目</title>
  <desc>白底与 #1E90FF 单色。两道开放折角围合一个立方模块，DBR 圆角字形嵌入其中，表达可组合、可试验的技术空间。</desc>
